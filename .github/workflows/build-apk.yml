name: AI Fejvadasz APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt letoltese
        uses: actions/checkout@v4
      - name: ZIP kibontasa
        run: |
          mkdir -p project
          unzip -q AI_Fejvadasz_v04_FRISS_PROJEKT.zip -d project
      - name: Java telepitese
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK elkeszitese
        working-directory: project
        run: sed -i 's/toLocaleUpperCase(/toUpperCase(/g' app/src/main/java/hu/allasradar/demo/MainActivity.java && gradle --no-daemon :app:assembleDebug
      - name: APK feltoltese
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fejvadasz-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
